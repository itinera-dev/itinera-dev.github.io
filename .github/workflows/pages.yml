name: Pages

# Builds the site and runs its verify gate on every pull request. On main, the
# site that passed the gate is published to GitHub Pages, at
# https://itinera-dev.org/.
#
# The gate builds the API references too, so a repository whose reference
# the site serves asks for a new deployment with a repository_dispatch event
# of type api-reference, after a release or a change on its main branch.

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [api-reference]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it supersedes. A run on main is
# never cancelled once it has started, so a deployment always finishes; a newer
# push to main only replaces a run that is still waiting.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run browsers
      - run: npm run verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
